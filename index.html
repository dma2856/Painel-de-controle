<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Admin - Controle de Clientes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>Meu Painel Admin</h2>
        <p>Seus Créditos: <strong>Infinitos</strong></p>
        <button class="btn-novo">+ Criar Novo Usuário</button>
    </header>

    <main>
        <table>
            <thead>
                <tr>
                    <th>Usuário</th>
                    <th>Senha</th>
                    <th>Validade</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </main>

   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
       // Configurações do seu Supabase
        const SUPABASE_URL = "https://djcvxbpfwmpvaewljarz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_U4kZxWPScx7VwGQsfI_i9w_Axuls7kx"; 

        // Inicializa a conexão
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 1. FUNÇÃO PARA CARREGAR OS CLIENTES NA TABELA
        async function carregarClientes() {
            const { data: clientes, error } = await supabaseClient
                .from('clientes')
                .select('*')
                .order('id', { ascending: true });

            if (error) {
                console.error("Erro ao buscar clientes:", error);
                return;
            }

            const tbody = document.querySelector("table tbody");
            tbody.innerHTML = ""; 

            clientes.forEach(cliente => {
                let dataIso = cliente.validade; // formato AAAA-MM-DD
                let dataFormatada = dataIso.split("-").reverse().join("/");
                
                let horarioPadrao = "12:00";

                const statusBadge = cliente.status === 'ativo' ? 'badge ativo' : 'badge bloqueado';
                const statusTextoBtn = cliente.status === 'ativo' ? 'Bloquear' : 'Desbloquear';
                const statusClasseBtn = cliente.status === 'ativo' ? 'btn-status btn-bloquear' : 'btn-status btn-desbloquear';
                const proximaAcao = cliente.status === 'ativo' ? 'bloquear' : 'desbloquear';

                const linha = `
                    <tr id="linha-${cliente.id}">
                        <td class="coluna-usuario">
                            <span class="texto-usuario">${cliente.usuario}</span>
                            <input type="text" class="edit-usuario" value="${cliente.usuario}" style="display: none; width: 90%;">
                        </td>
                        
                        <td class="coluna-senha">
                            <span class="texto-senha">${cliente.senha}</span>
                            <input type="text" class="edit-senha" value="${cliente.senha}" style="display: none; width: 90%;">
                        </td>

                        <td class="coluna-validade">
                            <span class="texto-validade">${dataFormatada} às ${horarioPadrao}</span>
                            <div class="inputs-edicao" style="display: none; gap: 5px;">
                                <input type="date" class="edit-data" value="${dataIso}">
                                <input type="time" class="edit-hora" value="${horarioPadrao}">
                            </div>
                        </td>

                        <td><span class="${statusBadge}">${cliente.status.toUpperCase()}</span></td>
                        
                        <td>
                            <div class="acoes-padrao">
                                <button class="btn-renovar" onclick="renovarUsuario(${cliente.id}, '${cliente.validade}')">Renovar +30 dias</button>
                                <button class="btn-editar" onclick="mostrarPainelEdicao(${cliente.id})">Editar</button>
                                <button class="${statusClasseBtn}" onclick="alterarStatus(${cliente.id}, '${proximaAcao}')">${statusTextoBtn}</button>
                                <button class="btn-excluir" onclick="excluirUsuario(${cliente.id})">Excluir</button>
                            </div>
                            <div class="acoes-salvar" style="display: none; gap: 5px;">
                                <button class="btn-salvar" onclick="salvarEdicao(${cliente.id})" style="background-color: #00b37e; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px;">✔ Salvar</button>
                                <button class="btn-cancelar" onclick="cancelarEdicao(${cliente.id})" style="background-color: #f75a5a; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px;">✖ Cancelar</button>
                            </div>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += linha;
            });
        }

        // FUNÇÃO PARA MOSTRAR OS CAMPOS DE EDIÇÃO (USUÁRIO, SENHA E DATA)
        function mostrarPainelEdicao(id) {
            const linha = document.getElementById(`linha-${id}`);
            
            // Esconde os textos fixos
            linha.querySelector('.texto-usuario').style.display = 'none';
            linha.querySelector('.texto-senha').style.display = 'none';
            linha.querySelector('.texto-validade').style.display = 'none';
            linha.querySelector('.acoes-padrao').style.display = 'none';

            // Mostra os inputs de edição
            linha.querySelector('.edit-usuario').style.display = 'inline-block';
            linha.querySelector('.edit-senha').style.display = 'inline-block';
            linha.querySelector('.inputs-edicao').style.display = 'flex';
            linha.querySelector('.acoes-salvar').style.display = 'flex';
        }

        // FUNÇÃO PARA CANCELAR A EDIÇÃO
        function cancelarEdicao(id) {
            const linha = document.getElementById(`linha-${id}`);
            
            // Mostra os textos fixos de volta
            linha.querySelector('.texto-usuario').style.display = 'inline';
            linha.querySelector('.texto-senha').style.display = 'inline';
            linha.querySelector('.texto-validade').style.display = 'inline';
            linha.querySelector('.acoes-padrao').style.display = 'block';

            // Esconde os inputs de edição
            linha.querySelector('.edit-usuario').style.display = 'none';
            linha.querySelector('.edit-senha').style.display = 'none';
            linha.querySelector('.inputs-edicao').style.display = 'none';
            linha.querySelector('.acoes-salvar').style.display = 'none';
        }

        // FUNÇÃO PARA SALVAR AS MODIFICAÇÕES (USUÁRIO, SENHA E DATA) NO SUPABASE
        async function salvarEdicao(id) {
            const linha = document.getElementById(`linha-${id}`);
            
            const novoUsuario = linha.querySelector('.edit-usuario').value.trim();
            const novaSenha = linha.querySelector('.edit-senha').value.trim();
            const novaData = linha.querySelector('.edit-data').value;

            if (!novoUsuario || !novaSenha || !novaData) {
                alert("Por favor, preencha todos os campos corretamente.");
                return;
            }

            // Atualiza tudo de uma vez só no banco de dados usando o método PATCH interno do SDK
            const { error } = await supabaseClient
                .from('clientes')
                .update({ 
                    usuario: novoUsuario, 
                    senha: novaSenha, 
                    validade: novaData 
                }) 
                .eq('id', id);

            if (error) {
                if (error.message.includes("unique")) {
                    alert("Erro: Esse nome de usuário já está sendo usado por outra pessoa.");
                } else {
                    alert("Erro ao salvar alterações: " + error.message);
                }
            } else {
                alert("Dados atualizados com sucesso!");
                carregarClientes();
            }
        }

        // 2. FUNÇÃO PARA CRIAR UM NOVO USUÁRIO
        document.querySelector(".btn-novo").addEventListener("click", async () => {
            const usuario = prompt("Digite o nome de usuário (login):");
            if (!usuario) return;

            const updateUsuario = usuario.trim();

            const senha = prompt("Digite a senha:");
            if (!senha) return;

            const updateSenha = senha.trim();

            let data = new Date();
            data.setDate(data.getDate() + 30);
            const validadeInicial = data.toISOString().split('T')[0];

            const { error } = await supabaseClient
                .from('clientes')
                .insert([
                    { usuario: updateUsuario, senha: updateSenha, validade: validadeInicial, status: 'ativo' }
                ]);

            if (error) {
                if (error.message.includes("unique")) {
                    alert("Esse usuário já existe! Escolha outro nome.");
                } else {
                    alert("Erro ao criar usuário: " + error.message);
                }
            } else {
                alert("Usuário criado com sucesso!");
                carregarClientes();
            }
        });

        // 3. FUNÇÃO PARA ALTERAR STATUS (BLOQUEAR/DESBLOQUEAR)
        async function alterarStatus(id, acao) {
            const novoStatus = acao === 'bloquear' ? 'bloqueado' : 'ativo';
            
            if (confirm(`Tem certeza que deseja ${acao} este usuário?`)) {
                const { error } = await supabaseClient
                    .from('clientes')
                    .update({ status: novoStatus })
                    .eq('id', id);

                if (error) {
                    alert("Erro ao alterar status: " + error.message);
                } else {
                    carregarClientes();
                }
            }
        }

        // 4. FUNÇÃO PARA EXCLUIR USUÁRIO
        async function excluirUsuario(id) {
            if (confirm("Tem certeza absoluta que deseja EXCLUIR este usuário?")) {
                const { error } = await supabaseClient
                    .from('clientes')
                    .delete()
                    .eq('id', id);

                if (error) {
                    alert("Erro ao excluir: " + error.message);
                } else {
                    carregarClientes();
                }
            }
        }

        // 5. FUNÇÃO PARA RENOVAR VALIDADE (+30 DIAS)
        async function renovarUsuario(id, validadeAtual) {
            if (confirm("Deseja adicionar +30 dias de validade para este usuário?")) {
                let data = new Date(validadeAtual + "T00:00:00");
                data.setDate(data.getDate() + 30);
                const novaValidade = data.toISOString().split('T')[0];

                const { error } = await supabaseClient
                    .from('clientes')
                    .update({ validade: novaValidade })
                    .eq('id', id);

                if (error) {
                    alert("Erro ao renovar: " + error.message);
                } else {
                    carregarClientes();
                }
            }
        }

        // Executa a busca assim que o painel abre
        carregarClientes();
    </script>
    
</body>
</html>
