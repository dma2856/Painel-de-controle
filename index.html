<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Admin - Controle de Clientes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>Meu Painel Admin</h2>
        <p>Seus Créditos: <strong>Infinitos</strong></p>
        <button class="btn-novo">+ Criar Novo Usuário</button>
    </header>

    <main>
        <table>
            <thead>
                <tr>
                    <th>Usuário</th>
                    <th>Senha</th>
                    <th>Validade</th>
                    <th>Limite Dispositivos</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </main>

   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "https://djcvxbpfwmpvaewljarz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_U4kZxWPScx7VwGQsfI_i9w_Axuls7kx"; 

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Gera uma string comparável com a data+hora atual no fuso do Brasil (Brasília)
        function obterDataHoraAtualBr() {
            const agora = new Date();
            // Deslocamento manual de fuso horário para o Brasil (UTC-3)
            const deslocamento = 3 * 60 * 60 * 1000; 
            const dataBr = new Date(agora.getTime() - deslocamento);
            return dataBr.toISOString().replace("Z", "");
        }

        // Trava automática para usuários vencidos baseada no fuso BR
        async function verificarEBloquearExpirados() {
            try {
                // Pega os dados apenas dos usuários ativos
                const { data: clientes, error } = await supabaseClient
                    .from('clientes')
                    .select('id, validade')
                    .eq('status', 'ativo');

                if (error) throw error;

                const agoraCompleto = obterDataHoraAtualBr(); // Formato: AAAA-MM-DDTHH:MM...
                const idsParaBloquear = [];

                clientes.forEach(cliente => {
                    let dataParte = cliente.validade; // Ex: "2026-05-31"
                    let horaParte = localStorage.getItem(`hora_cliente_${cliente.id}`) || "12:00";
                    
                    // Monta a linha do tempo exata do vencimento deste cliente
                    const validadeCompletaCliente = `${dataParte}T${horaParte}:00.000`;

                    // Se o momento atual passou da validade montada, adiciona na lista de bloqueio
                    if (agoraCompleto >= validadeCompletaCliente) {
                        idsParaBloquear.push(cliente.id);
                    }
                });

                // Executa o bloqueio em lote no Supabase
                if (idsParaBloquear.length > 0) {
                    await supabaseClient
                        .from('clientes')
                        .update({ status: 'bloqueado' })
                        .in('id', idsParaBloquear);
                    console.log(`${idsParaBloquear.length} clientes expirados foram bloqueados automaticamente.`);
                }
            } catch (err) {
                console.error("Erro na verificação de vencidos:", err);
            }
        }

        // CARREGAR CLIENTES NA TABELA
        async function carregarClientes() {
            // Roda a trava de segurança antes de desenhar os componentes na tela
            await verificarEBloquearExpirados();

            const { data: clientes, error } = await supabaseClient
                .from('clientes')
                .select('*')
                .order('id', { ascending: true });

            if (error) {
                console.error("Erro ao buscar clientes:", error);
                return;
            }

            const tbody = document.querySelector("table tbody");
            tbody.innerHTML = ""; 

            clientes.forEach(cliente => {
                let dataParte = cliente.validade; 
                let horaParte = localStorage.getItem(`hora_cliente_${cliente.id}`) || "12:00";

                let dataFormatada = dataParte.split("-").reverse().join("/");
                let limiteDisp = cliente.limite_dispositivos ?? 1;

                const statusBadge = cliente.status === 'ativo' ? 'badge ativo' : 'badge bloqueado';
                const statusTextoBtn = cliente.status === 'ativo' ? 'Bloquear' : 'Desbloquear';
                const statusClasseBtn = cliente.status === 'ativo' ? 'btn-status btn-bloquear' : 'btn-status btn-desbloquear';
                const proximaAcao = cliente.status === 'ativo' ? 'bloquear' : 'desbloquear';

                const linha = `
                    <tr id="linha-${cliente.id}">
                        <td class="coluna-usuario">
                            <span class="texto-usuario">${cliente.usuario}</span>
                            <input type="text" class="edit-usuario" value="${cliente.usuario}" style="display: none; width: 90%;">
                        </td>
                        
                        <td class="coluna-senha">
                            <span class="texto-senha">${cliente.senha}</span>
                            <input type="text" class="edit-senha" value="${cliente.senha}" style="display: none; width: 90%;">
                        </td>

                        <td class="coluna-validade">
                            <span class="texto-validade">${dataFormatada} às ${horaParte}</span>
                            <div class="inputs-edicao" style="display: none; gap: 5px;">
                                <input type="date" class="edit-data" value="${dataParte}">
                                <input type="time" class="edit-hora" value="${horaParte}">
                            </div>
                        </td>

                        <td class="coluna-limite">
                            <span class="texto-limite">${limiteDisp}</span>
                            <input type="number" class="edit-limite" value="${limiteDisp}" min="1" style="display: none; width: 60px;">
                        </td>

                        <td><span class="${statusBadge}">${cliente.status.toUpperCase()}</span></td>
                        
                        <td>
                            <div class="acoes-padrao">
                                <button class="btn-renovar" onclick="renovarUsuario(${cliente.id}, '${cliente.validade}')">Renovar +30 dias</button>
                                <button class="btn-editar" onclick="mostrarPainelEdicao(${cliente.id})">Editar</button>
                                <button class="${statusClasseBtn}" onclick="alterarStatus(${cliente.id}, '${proximaAcao}')">${statusTextoBtn}</button>
                                <button class="btn-excluir" onclick="excluirUsuario(${cliente.id})">Excluir</button>
                            </div>
                            <div class="acoes-salvar" style="display: none; gap: 5px;">
                                <button class="btn-salvar" onclick="salvarEdicao(${cliente.id})" style="background-color: #00b37e; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px;">✔ Salvar</button>
                                <button class="btn-cancelar" onclick="cancelarEdicao(${cliente.id})" style="background-color: #f75a5a; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px;">✖ Cancelar</button>
                            </div>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += linha;
            });
        }

        function mostrarPainelEdicao(id) {
            const linha = document.getElementById(`linha-${id}`);
            linha.querySelector('.texto-usuario').style.display = 'none';
            linha.querySelector('.texto-senha').style.display = 'none';
            linha.querySelector('.texto-validade').style.display = 'none';
            linha.querySelector('.texto-limite').style.display = 'none';
            linha.querySelector('.acoes-padrao').style.display = 'none';

            linha.querySelector('.edit-usuario').style.display = 'inline-block';
            linha.querySelector('.edit-senha').style.display = 'inline-block';
            linha.querySelector('.inputs-edicao').style.display = 'flex';
            linha.querySelector('.edit-limite').style.display = 'inline-block';
            linha.querySelector('.acoes-salvar').style.display = 'flex';
        }

        function cancelarEdicao(id) {
            const deleteLinha = document.getElementById(`linha-${id}`);
            deleteLinha.querySelector('.texto-usuario').style.display = 'inline';
            deleteLinha.querySelector('.texto-senha').style.display = 'inline';
            deleteLinha.querySelector('.texto-validade').style.display = 'inline';
            deleteLinha.querySelector('.texto-limite').style.display = 'inline';
            deleteLinha.querySelector('.acoes-padrao').style.display = 'block';

            deleteLinha.querySelector('.edit-usuario').style.display = 'none';
            deleteLinha.querySelector('.edit-senha').style.display = 'none';
            deleteLinha.querySelector('.inputs-edicao').style.display = 'none';
            deleteLinha.querySelector('.edit-limite').style.display = 'none';
            deleteLinha.querySelector('.acoes-salvar').style.display = 'none';
        }

        // SALVAR EDIÇÃO (MUDANÇA FIXA NA STR DA LINHA)
        async function salvarEdicao(id) {
            const linha = document.getElementById(`linha-${id}`);
            
            const novoUsuario = linha.querySelector('.edit-usuario').value.trim();
            const novaSenha = inline = linha.querySelector('.edit-senha').value.trim();
            const novaData = linha.querySelector('.edit-data').value;
            const novaHora = linha.querySelector('.edit-hora').value || "12:00"; 
            const novoLimite = parseInt(linha.querySelector('.edit-limite').value) || 1;

            if (!novoUsuario || !novaSenha || !novaData) {
                alert("Por favor, preencha todos os campos corretamente.");
                return;
            }

            // Persiste a hora localmente no navegador vinculada ao id do cliente
            localStorage.setItem(`hora_cliente_${id}`, novaHora);

            const { error } = await supabaseClient
                .from('clientes')
                .update({ 
                    usuario: novoUsuario, 
                    senha: novaSenha, 
                    validade: novaData, // Envia o padrão aceito pelo tipo DATE (AAAA-MM-DD)
                    limite_dispositivos: novoLimite,
                    status: 'ativo' // Garante voltar ativo se você moveu a validade para o futuro
                }) 
                .eq('id', id);

            if (error) {
                alert("Erro ao salvar alterações: " + error.message);
            } else {
                alert("Dados atualizados com sucesso!");
                carregarClientes();
            }
        }

        // CRIAR NOVO USUÁRIO
        document.querySelector(".btn-novo").addEventListener("click", async () => {
            const usuario = prompt("Digite o nome de usuário (login):");
            if (!usuario) return;
            const updateUsuario = usuario.trim();

            const MapSenha = prompt("Digite a senha:");
            if (!MapSenha) return;
            const updateSenha = MapSenha.trim();

            const limiteInput = prompt("Digite o limite de conexões/dispositivos (Padrão é 1):", "1");
            const limiteDispositivos = parseInt(limiteInput) || 1;

            let data = new Date();
            data.setDate(data.getDate() + 30);
            const dataIso = data.toISOString().split('T')[0];

            const { data: novoCliente, error } = await supabaseClient
                .from('clientes')
                .insert([
                    { 
                        usuario: updateUsuario, 
                        senha: updateSenha, 
                        validade: dataIso, 
                        status: 'ativo',
                        limite_dispositivos: limiteDispositivos
                    }
                ]).select();

            if (error) {
                alert("Erro ao criar usuário: " + error.message);
            } else {
                if(novoCliente && novoCliente[0]) {
                    localStorage.setItem(`hora_cliente_${novoCliente[0].id}`, "23:59");
                }
                alert("Usuário criado com sucesso!");
                carregarClientes();
            }
        });

        // MANIPULAR STATUS MANUALMENTE
        async function alterarStatus(id, acao) {
            const novoStatus = acao === 'bloquear' ? 'bloqueado' : 'ativo';
            if (confirm(`Tem certeza que deseja ${acao} este usuário?`)) {
                const { error } = await supabaseClient
                    .from('clientes')
                    .update({ status: novoStatus })
                    .eq('id', id);

                if (error) alert("Erro ao alterar status: " + error.message);
                else carregarClientes();
            }
        }

        // DELETAR USUÁRIO
        async function excluirUsuario(id) {
            if (confirm("Tem certeza absoluta que deseja EXCLUIR este usuário?")) {
                const { error } = await supabaseClient
                    .from('clientes')
                    .delete()
                    .eq('id', id);

                if (error) alert("Erro ao excluir: " + error.message);
                else {
                    localStorage.removeItem(`hora_cliente_${id}`);
                    carregarClientes();
                }
            }
        }

        // RENOVAÇÃO RÁPIDA (+30 DIAS)
        async function renovarUsuario(id, validadeAtual) {
            if (confirm("Deseja adicionar +30 dias de validade para este usuário?")) {
                let data = new Date(validadeAtual + "T00:00:00");
                data.setDate(data.getDate() + 30);
                
                const novaDataIso = data.toISOString().split('T')[0];

                const { error } = await supabaseClient
                    .from('clientes')
                    .update({ 
                        validade: novaDataIso,
                        status: 'ativo'
                    })
                    .eq('id', id);

                if (error) {
                    alert("Erro ao renovar: " + error.message);
                } else {
                    alert("Usuário renovado com sucesso!");
                    carregarClientes();
                }
            }
        }

        // Inicializa puxando a lista atualizada
        carregarClientes();
    </script>
</body>
</html>
